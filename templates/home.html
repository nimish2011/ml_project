<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef6ff, #f6f0ff);
            color: #1f2937;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 24px;
        }
        .card {
            background: rgba(255,255,255,0.9);
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(31, 41, 55, 0.12);
            padding: 32px;
        }
        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #1d4ed8;
        }
        .subtitle {
            text-align: center;
            color: #4b5563;
            margin-bottom: 24px;
        }
        form {
            display: grid;
            grid-template-columns: repeat(2, minmax(220px, 1fr));
            gap: 18px;
        }
        .field {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }
        select, input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            background: #fff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96,165,250,0.2);
        }
        .full-width {
            grid-column: 1 / -1;
        }
        .btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            padding: 14px 18px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(37, 99, 235, 0.2);
        }
        .result {
            margin-top: 28px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: #0f766e;
            background: #ecfeff;
            border: 1px solid #a7f3d0;
            border-radius: 12px;
            padding: 16px;
        }
        @media (max-width: 700px) {
            form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Student Exam Performance Indicator</h1>
            <p class="subtitle">Predict the student's maths score based on personal and academic data</p>

            <form action="{{ url_for('predict_datapoint') }}" method="post">
                <div class="field">
                    <label>Gender</label>
                    <select name="gender" required>
                        <option selected disabled value="">Select your Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div class="field">
                    <label>Race or Ethnicity</label>
                    <select name="ethnicity" required>
                        <option selected disabled value="">Select Ethnicity</option>
                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>

                <div class="field">
                    <label>Parental Level of Education</label>
                    <select name="parental_level_of_education" required>
                        <option selected disabled value="">Select Parent Education</option>
                        <option value="associate's degree">associate's degree</option>
                        <option value="bachelor's degree">bachelor's degree</option>
                        <option value="high school">high school</option>
                        <option value="master's degree">master's degree</option>
                        <option value="some college">some college</option>
                        <option value="some high school">some high school</option>
                    </select>
                </div>

                <div class="field">
                    <label>Lunch Type</label>
                    <select name="lunch" required>
                        <option selected disabled value="">Select Lunch Type</option>
                        <option value="free/reduced">free/reduced</option>
                        <option value="standard">standard</option>
                    </select>
                </div>

                <div class="field">
                    <label>Test Preparation Course</label>
                    <select name="test_preparation_course" required>
                        <option selected disabled value="">Select Test Course</option>
                        <option value="none">None</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div class="field">
                    <label>Reading Score</label>
                    <input type="number" name="reading_score" min="0" max="100" placeholder="Enter your reading score" required>
                </div>

                <div class="field">
                    <label>Writing Score</label>
                    <input type="number" name="writing_score" min="0" max="100" placeholder="Enter your writing score" required>
                </div>

                <div class="field full-width">
                    <button class="btn" type="submit">Predict your Maths Score</button>
                </div>
            </form>

            <div class="result">
                Predicted Maths Score: {{ results if results is not none else '---' }}
            </div>
        </div>
    </div>
</body>
</html>
